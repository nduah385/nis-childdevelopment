name: Fix v2.3 canonical URLs once

on:
  push:
    paths:
      - '.github/workflows/fix-v23-canonical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unresolved canonical placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          fixed = text.replace('__CANONICAL_URL__', 'https://nduah385.github.io/nis-childdevelopment/')
          p.write_text(fixed, encoding='utf-8')
          PY
      - name: Commit repair if needed
        run: |
          if git diff --quiet -- index.html; then
            echo 'No canonical placeholder changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix v2.3 canonical and social URLs'
          git push
